  button:focus-visible { outline:2px solid var(--blue); outline-offset:2px; }

  .nav { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:5; display:flex; align-items:center; gap:14px;

  .nav button.next { background:linear-gradient(135deg,#5b7cff,#a06cd5); color:#fff; border-color:#8fa6ff; }
  .nav button.next:hover { filter:brightness(1.12); }
  .cap { min-width:min(300px,48vw); text-align:center; }
  .cap .t { font-size:14px; font-weight:700; }
  .cap .n { color:var(--faint); font-family:var(--f-mono); font-size:12px; margin-right:8px; }
  .dots { display:flex; gap:4px; justify-content:center; margin-top:6px; flex-wrap:wrap; max-width:min(720px,70vw); }
  .dots i { width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.18); cursor:pointer; transition:background .3s, transform .3s; }
  .dots i.done { background:rgba(124,196,255,.5); }
  .dots i.cur { background:var(--gold); transform:scale(1.5); }
  #hint { position:fixed; left:50%; bottom:88px; transform:translateX(-50%); z-index:5; font-size:12px; color:var(--muted); transition:opacity 1s; pointer-events:none; white-space:nowrap; }

  #load .box { text-align:center; }

  #load .bar { width:min(320px,70vw); height:3px; background:rgba(255,255,255,.1); border-radius:3px; overflow:hidden; margin:0 auto; }
  #load .bar i { display:block; height:100%; width:0; background:linear-gradient(90deg,#7cc4ff,#ffc94a); transition:width .2s; }
  #load .s { font-size:12px; color:var(--muted); margin-top:10px; font-family:var(--f-mono); }
  @media (max-width: 700px) { .brand h1 { font-size:16px; } .tools button { padding:5px 10px; font-size:12px; } .cap .t { font-size:12px; } #hint { display:none; } }

<script>

const QS = new URLSearchParams(location.search);
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const lin = hex => new THREE.Color(hex).convertSRGBToLinear();
const INK = "#f1e8d6";
const TCOL = { g: "#ffc94a", m: "#ff70b0", b: "#7cc4ff", r: "#ff6b6b", n: "#66e09a" };

/* ═════════════ 단계 · 글 · 카메라 — content.js 의 UNIT 에서 만든다 ═════════════
   블록(교과서 한 덩어리)의 parts 하나가 한 단계. 앞 단계의 줄은 블록이 끝날 때까지 남는다. */
const ANCH = {
  P:  { pos: [0, 0, 4],    yaw: 0,     tilt: 0 },      // 가운데 제목
  L:  { pos: [-44, 0, 3],  yaw: 0.55,  tilt: 0.24 },   // 왼쪽 벽 (복도 가운데 쪽으로 돌아섬)
  R:  { pos: [45, 0, 3],   yaw: -0.55, tilt: 0.24 },   // 오른쪽 벽
  C:  { pos: [0, 0, 6],    yaw: 0,     tilt: 0 },      // 정리·조건 상자
  MA: { pos: [0, 0, 18],   yaw: 0,     tilt: 0 },      // 앞쪽 큰 수식 (뒷줄)
  MB: { pos: [0, 0, 24],   yaw: 0,     tilt: 0 },      // 앞쪽 큰 수식 (앞줄)
};
const X0 = -14;   // 설명 기둥 왼쪽 끝
const STEPS = [], TEXTS = [], CAM = [], HOLDS = [], STEP_BLOCK = [];
(() => {
  let s = 0;
  const camFor = (side, k) => side === "L" ? { p: [13 - k, 31 - k, 84 + k * 2], t: [-14, 19.5 - k * 0.4, 3] }
    : side === "R" ? { p: [-13 + k, 31 - k, 84 + k * 2], t: [14, 19.5 - k * 0.4, 3] } : { p: [0, 24, 92], t: [0, 20, 2] };
  for (const b of UNIT.blocks) {
    const n = b.parts.length; b.s0 = s; b.s1 = s + n - 1;
    b.parts.forEach((pt, k) => {
      STEPS.push(b.name ? (n > 1 ? `${b.name} (${k + 1}/${n})` : b.name) : b.title);
      CAM.push(camFor(b.side, k)); HOLDS.push(k === n - 1 ? (b.hold || 0) : 0); STEP_BLOCK.push(b);
    });
    if (b.side === "L" || b.side === "R") {
      if (b.tag) TEXTS.push({ a: b.side, from: b.s0, to: b.s1, size: 1.1, y: 36.2, x: X0, text: `{g:${b.tag}}` });
      if (b.title) TEXTS.push({ a: b.side, from: b.s0, to: b.s1, font: "t", size: 2.25, y: 32.2, x: X0, depth: 0.4, text: b.title });
      // 벽에 다 들어가지 않으면 새 쪽: 앞 줄들을 지우고 맨 위부터 (첫 부분의 문제 글은 그대로 둔다)
      const TOP = b.title ? 27.8 : 32.0, FLOOR = 3.4, GAP = 2.7, SZ = 1.42;
      let y = TOP, page = [];
      b.parts.forEach((pt, k) => {
        const gapOf = l => !l ? 1.1 : /dfrac|frac|left\(/.test(l) ? GAP * 1.45 : GAP;   // 분수가 든 줄은 더 띄운다
        const lines = pt.L || [], need = lines.reduce((h, l) => h + gapOf(l), 0);
        if (k > 0 && y - need < FLOOR) {
          for (const t of page) t.to = b.s0 + k - 1;
          page = []; y = TOP;
        }
        for (const line of lines) {
          if (!line) { y -= 1.1; continue; }
          const tall = gapOf(line) > GAP; if (tall) y -= GAP * 0.22;
          const t = { a: b.side, from: b.s0 + k, to: b.s1, size: SZ, y, x: X0, text: line };
          TEXTS.push(t); page.push(t); y -= tall ? GAP * 1.23 : GAP;
        }
      });
    } else {
      const top = b.kind === "title" ? 0 : 1;
      if (b.kind === "title") {
        TEXTS.push({ a: "P", from: b.s0, to: b.s1, size: 1.2, y: 43.5, align: "c", text: `{g:${UNIT.eyebrow}}` });
        TEXTS.push({ a: "P", from: b.s0, to: b.s1, font: "t", size: 4.2, y: 37.5, align: "c", depth: 0.5, text: UNIT.title });
        TEXTS.push({ a: "P", from: b.s0, to: b.s1, size: 1.5, y: 32.6, align: "c", text: UNIT.sub });
      } else {
        TEXTS.push({ a: "P", from: b.s0, to: b.s1, font: "t", size: 2.6, y: 42.5, align: "c", depth: 0.42, text: b.title });
        if (b.sub) TEXTS.push({ a: "P", from: b.s0, to: b.s1, size: 1.2, y: 38.8, align: "c", text: b.sub });
        let y = b.sub ? 34.6 : 36.4;
        for (const line of b.box || []) { const tall = /dfrac/.test(line); if (tall) y -= 0.7; TEXTS.push({ a: "C", box: "box" + b.s0, from: b.s0, to: b.s1, size: 1.42, y, depth: 0.3, text: line }); y -= tall ? 4.4 : 2.7; }
      }
    }
    // 큰 수식: 그 단계부터, 다음 큰 수식이 나오기 전까지
    const bigAt = b.parts.map((pt, k) => pt.big ? k : -1).filter(k => k >= 0);
    bigAt.forEach((k, i) => {
      const to = i + 1 < bigAt.length ? b.s0 + bigAt[i + 1] - 1 : b.s1;
      const lines = b.parts[k].big;
      lines.forEach((t, j) => TEXTS.push({ a: lines.length > 1 && j === 0 ? "MA" : "MB", from: b.s0 + k, to, size: 1.95, y: lines.length > 1 && j === 0 ? 7.6 : 4.6, align: "c", depth: 0.5, delay: 0.5, text: t }));
    });
    s += n;
  }
})();
window.HOLDS = HOLDS;

function prFor() { return QS.has("pr") ? parseFloat(QS.get("pr")) || 1 : Math.min(3, Math.max(window.devicePixelRatio || 1, 3840 / window.innerWidth)); }

renderer.setPixelRatio(prFor());
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;

$("gl").appendChild(renderer.domElement);
const scene = new THREE.Scene();
const HORIZON = lin("#2a2f5e");
scene.fog = new THREE.Fog(HORIZON, 140, 900);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.3, 4000);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new THREE.RoomEnvironment(), 0.04).texture;

/* 하늘: 짙은 남보라 + 지평선 빛 + 오로라 + 별 */
const skyUni = { uHor: { value: HORIZON }, uZen: { value: lin("#070a1f") }, uTime: { value: 0 } };
scene.add(new THREE.Mesh(new THREE.SphereGeometry(2000, 64, 32), new THREE.ShaderMaterial({
  uniforms: skyUni, side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position + cameraPosition, 1.0); }`,
  fragmentShader: `uniform vec3 uHor, uZen; uniform float uTime; varying vec3 vP;
    float h21(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
    float n2(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);

    const top = Math.max(...B.lines.map(L => L.group.position.y + L.y1)), bot = Math.min(...B.lines.map(L => L.group.position.y + L.y0));
    const w = wMax + 3.2, h = top - bot + 2.4, z = Math.min(...B.lines.map(L => L.group.position.z)) - 0.45;
    const grp = new THREE.Group(); grp.position.set(0, (top + bot) / 2, z); anchors[B.a].add(grp);
    const back = chip(w, h, "#1b2150", 0.25); back.material.transparent = true; back.material.opacity = 0.72; grp.add(back);
    const outer = rrect(w + 0.5, h + 0.5, 1.0); outer.holes.push(rrect(w - 0.1, h - 0.1, 0.8));
    const fg = new THREE.ExtrudeGeometry(outer, { depth: 0.5, bevelEnabled: true, bevelThickness: 0.05, bevelSize: 0.05, bevelSegments: 2, curveSegments: 12 });
    fg.translate(0, 0, -0.2);
    const frame = new THREE.Mesh(fg, new THREE.MeshPhysicalMaterial({ color: lin("#ffc94a"), roughness: 0.45, metalness: 0.3, clearcoat: 0.4 }));
    frame.castShadow = true; grp.add(frame);
    const when = B.lines[0].when;
    A(when, v => { const e = backOut(clamp01(v * 1.3)); grp.scale.set(Math.max(1e-3, e), Math.max(1e-3, e), 1); grp.visible = v > 0.001; }, 0.8, 0.2);
  }
  graph.buildLabels();
  progress((TEXTS.length + 2) / (TEXTS.length + 3), "그래프");
  // 마지막 단계 배지
  const BS = 3.0, B = buildLine({ text: `{g:${UNIT.title} 끝}`, font: "t", size: BS, align: "cc", depth: 0.3 });
  badge = new THREE.Group(); badge.add(B.group);
  const bc = chip(B.width + 4, B.y1 - B.y0 + 3.2, "#232b58", 0.5); bc.position.z = -B.dep * BS / 2 - 0.05; badge.add(bc);
  badge.position.set(34, 34, -4); badge.rotation.y = -0.4; scene.add(badge);
  A(() => step === STEPS.length - 1, v => {
    B.uni.uProg.value = clamp01(v); for (const c of B.chunks) c.mesh.visible = v > 0.001;
    const e = backOut(clamp01(v * 1.4)); bc.scale.set(Math.max(1e-3, e), Math.max(1e-3, e), 1); badge.visible = v > 0.001;
  }, 0.7, 1.2);
}

/* 종이 꽃가루 (색마다 하나의 InstancedMesh) */
const confetti = (() => {
  const cols = ["#c2185b", "#1565c0", "#d4a017", "#2e7d32", "#ef6c00", "#6a1b9a"], per = 150, n = per * cols.length;
  const geo = new THREE.PlaneGeometry(0.5, 0.28);
  const ims = cols.map(c => { const im = new THREE.InstancedMesh(geo, new THREE.MeshLambertMaterial({ color: lin(c), emissive: lin(c), emissiveIntensity: 0.35, side: THREE.DoubleSide }), per);
    im.castShadow = true; im.frustumCulled = false; im.count = 0; scene.add(im); return im; });
  const P = [], Vv = [], R = [], W = [];
  for (let i = 0; i < n; i++) { P.push(V3()); Vv.push(V3()); R.push(new THREE.Euler()); W.push(V3()); }
  const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), S = V3(1, 1, 1);
  let t = 99;
  return {
    fire(o) {
      t = 0; ims.forEach(im => im.count = per);
      for (let i = 0; i < n; i++) {
        P[i].copy(o).add(V3((Math.random() - 0.5) * 6, (Math.random() - 0.5) * 3, (Math.random() - 0.5) * 2));
        const th = Math.random() * 6.283, sp = 6 + Math.random() * 16;
        Vv[i].set(Math.cos(th) * sp, 8 + Math.random() * 14, Math.sin(th) * sp * 0.6 + 4);
        R[i].set(Math.random() * 6, Math.random() * 6, Math.random() * 6); W[i].set(Math.random() * 8 - 4, Math.random() * 8 - 4, Math.random() * 8 - 4);
      }
    },
    update(dt) {
      if (t > 7) { ims.forEach(im => im.count = 0); return; }
      t += dt;
      const s = t > 5.5 ? Math.max(0.001, 1 - (t - 5.5) / 1.5) : 1;
      for (let i = 0; i < n; i++) {
        const p = P[i], v = Vv[i];
        if (p.y > 0.05) {
          v.y -= 14 * dt; v.multiplyScalar(Math.exp(-dt * 1.6)); v.y = Math.max(v.y, -5 - (i % 5));
          p.addScaledVector(v, dt); R[i].x += W[i].x * dt; R[i].y += W[i].y * dt; R[i].z += W[i].z * dt;
          if (p.y < 0.05) { p.y = 0.05; R[i].set(-Math.PI / 2, 0, R[i].z); }
        }
        M.compose(p, Q.setFromEuler(R[i]), S.set(s, s, s)); ims[i % cols.length].setMatrixAt(Math.floor(i / cols.length), M);
      }
      ims.forEach(im => im.instanceMatrix.needsUpdate = true);
    }
  };
})();

/* ═════════════ 카메라 ═════════════ */
const pose = i => ({ p: V3(...CAM[i].p), t: V3(...CAM[i].t) });
const cam = { p: V3(90, 80, 170), t: V3(0, 12, 0) };
let fly = null;
function flyTo(P, dur, arc) {
  const p0 = cam.p.clone(), t0 = cam.t.clone(); let ctrl = null;
  if (arc) { ctrl = p0.clone().add(P.p).multiplyScalar(0.5); const side = V3(P.p.z - p0.z, 0, -(P.p.x - p0.x)).normalize().multiplyScalar(arc.side || 0); ctrl.y += arc.up; ctrl.z += arc.back || 0; ctrl.add(side); }
  fly = { p0, t0, p1: P.p, t1: P.t, dur, t: 0, ctrl };
}
const confettiAt = V3(40, 30, 8);
let confT = -1;   // 꽃가루 예약 (가상 시간 — 영상 녹화에서도 같은 때 터진다)
function go(n, instant) {
  n = Math.max(0, Math.min(STEPS.length - 1, n));
  const prev = step; step = n; stepT0 = time;   // 단계에 들어온 시각 (되돌아보기 회전의 기준)
  if (n !== prev) resetView();
  if (instant) { const P = pose(n); cam.p.copy(P.p); cam.t.copy(P.t); fly = null; }
  else if (n === STEPS.length - 1) flyTo(pose(n), 4.5, { up: 25, side: 25 });
  else if (Math.abs(n - prev) === 1 && Math.sign(CAM[n].p[0]) === Math.sign(CAM[prev].p[0])) flyTo(pose(n), 2.2, null);
  else flyTo(pose(n), 3.2, { up: 10, back: 18, side: 0 });
  if (n === STEPS.length - 1 && prev !== n) confT = 1.3;
  document.querySelector(".brand").classList.toggle("hide", n > 0 && n < STEPS.length - 1);
  $("capT").innerHTML = `<span class="n">${n + 1}/${STEPS.length}</span>${STEPS[n]}`;
  speak(n);
  $("bPrev").disabled = n === 0; $("bNext").disabled = n === STEPS.length - 1;
  $("bNext").textContent = n === STEPS.length - 2 ? "되돌아보기 ▶" : "다음 ▶";
  [...$("dots").children].forEach((d, i) => { d.className = i === n ? "cur" : i < n ? "done" : ""; });
}
STEPS.forEach((s, i) => { const d = document.createElement("i"); d.title = s; d.onclick = () => go(i); $("dots").appendChild(d); });
$("bPrev").onclick = () => go(step - 1);
$("bNext").onclick = () => go(step + 1);
$("bHome").onclick = () => startIntro();
let auto = false, autoT = 0;
$("bAuto").onclick = () => { auto = !auto; autoT = 0; $("bAuto").setAttribute("aria-pressed", String(auto)); };
/* 단계별 해설 음성 (Azure TTS 로 미리 만든 audio/stepNN.mp3 — make_voice.py)
   브라우저는 사용자가 한 번 누르거나 키를 친 뒤에야 소리를 낸다 → 첫 조작 때 현재 단계를 읽는다.
   음성 파일이 없으면 조용히 넘어가고 자동 재생은 예전처럼 9초 간격이다. */
const narr = new Audio(); narr.preload = "auto";
let voiceOn = !QS.has("mute"), primed = false, spoken = -1;
function speak(n) {
  narr.pause();
  if (!voiceOn || !primed) return;
  spoken = n; narr.src = `audio/step${String(n).padStart(2, "0")}.mp3`; narr.currentTime = 0;
  narr.play().catch(() => {});
}
const prime = () => { if (primed) return; primed = true; setTimeout(() => { if (spoken !== step) speak(step); }, 0); };
addEventListener("pointerdown", prime, true); addEventListener("keydown", prime, true);
const voiceBusy = () => voiceOn && primed && !narr.error && !narr.ended && !narr.paused;
$("bVoice").onclick = () => {
  voiceOn = !voiceOn; $("bVoice").setAttribute("aria-pressed", String(voiceOn)); $("bVoice").textContent = voiceOn ? "🔊 음성" : "🔇 음성";
  if (voiceOn) speak(step); else narr.pause();
};
if (!voiceOn) { $("bVoice").setAttribute("aria-pressed", "false"); $("bVoice").textContent = "🔇 음성"; }
addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); go(step + 1); }
  if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(step - 1); }
  if (e.key === "Home") startIntro();
});
/* 마우스·터치 조작
   왼쪽 끌기: 회전 · 휠/두 손가락: 확대·축소(원근) · 오른쪽 끌기 또는 Shift+끌기: 이동 · 두 번 클릭: 원래 시점 */
const view = { yaw: 0, pitch: 0, zoom: 0, px: 0, py: 0 };     // 목표값
const viewS = { yaw: 0, pitch: 0, zoom: 0, px: 0, py: 0 };    // 부드럽게 따라가는 값
function resetView() { Object.assign(view, { yaw: 0, pitch: 0, zoom: 0, px: 0, py: 0 }); }
{
  const el = renderer.domElement, ptrs = new Map();
  let mode = null, lastPinch = 0;
  el.style.touchAction = "none"; el.style.cursor = "grab";
  el.addEventListener("contextmenu", e => e.preventDefault());
  el.addEventListener("pointerdown", e => {
    el.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    mode = ptrs.size >= 2 ? "pinch" : (e.button === 2 || e.shiftKey) ? "pan" : "rot";
    if (mode === "pinch") { const [a, b] = [...ptrs.values()]; lastPinch = Math.hypot(a.x - b.x, a.y - b.y); }
    el.style.cursor = "grabbing";
  });
  el.addEventListener("pointermove", e => {
    const p = ptrs.get(e.pointerId); if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
    if (mode === "pinch" && ptrs.size >= 2) {
      const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
      if (lastPinch > 0) view.zoom = THREE.MathUtils.clamp(view.zoom - Math.log(d / lastPinch), -1.1, 1.0);
      lastPinch = d;
    } else if (mode === "rot") {
      view.yaw -= dx * 0.005; view.pitch = THREE.MathUtils.clamp(view.pitch + dy * 0.004, -0.5, 1.0);
    } else if (mode === "pan") {
      const k = 0.06 * Math.exp(viewS.zoom); view.px -= dx * k; view.py += dy * k;
    }
  });
  const up = e => { ptrs.delete(e.pointerId); mode = ptrs.size ? "rot" : null; el.style.cursor = "grab"; };
  el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up);
  el.addEventListener("wheel", e => { e.preventDefault(); view.zoom = THREE.MathUtils.clamp(view.zoom + e.deltaY * 0.0012, -1.1, 1.0); }, { passive: false });
  el.addEventListener("dblclick", resetView);
}

let introT = 99;
function startIntro() {
  introT = 0; introReady = false;
  go(0, false);
  cam.p.set(95, 70, 175); cam.t.set(0, 12, 0);
  flyTo(pose(0), 6.0, { up: 25, side: -40 });
}

function onResize() {
  const pr = prFor();
  renderer.setPixelRatio(pr); renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.fov = camera.aspect < 1.2 ? 62 : camera.aspect < 1.6 ? 46 : 40; camera.updateProjectionMatrix();
  motes.uniforms.uPR.value = pr;
}
addEventListener("resize", onResize); onResize();

/* ═════════════ 루프 ═════════════ */
let last = performance.now(), time = 0, stepT0 = 0;
const fwd = V3(), right = V3(), off = V3();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (REC.on) return;   // 녹화 중에는 REC.shot() 이 한 장씩 그린다
  tick(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
function tick(dt) {
  time += dt; introT += dt;
  if (!introReady && introT > 1.6) introReady = true;
  // 조명: 처음엔 어둡다가 켜진다
  const li = introT > 3.2 ? 1 : easeOut(clamp01((introT - 1.2) / 2.0)) * (introT < 1.9 && Math.sin(introT * 70) < 0 ? 0.4 : 1);
  renderer.toneMappingExposure = 1.0 * (0.08 + 0.92 * li);
  for (const o of anims) {
    const tg = o.when() ? 1 : -o.delay;
    if (tg > o.v) o.v = Math.min(tg, o.v + dt * o.speed); else o.v = Math.max(tg, o.v - dt * o.speed * 1.8);
    o.apply(o.v);
  }
  // 날아간 조각의 원본은 숨긴다 (원본 줄이 사라지는 중일 때)
  for (const L of LINES) {
    const on = L.when();
    for (const c of L.chunks) if (!c.src) c.mesh.visible = c.baseVis && !(!on && c.consumers.some(k => k.fly > 0.001));
  }
  graph.update(dt, time);
  skyUni.uTime.value = time; motes.uniforms.uTime.value = time;
  for (const c of crystals) { c.rotation.y += dt * c.userData.sp; c.rotation.x = Math.sin(time * 0.2 + c.userData.ph) * 0.3; c.position.y = c.userData.y0 + Math.sin(time * 0.4 + c.userData.ph) * 3; }
  if (confT > 0) { confT -= dt; if (confT <= 0) confetti.fire(confettiAt); }
  confetti.update(dt);
  if (badge) badge.rotation.y = -0.3 + Math.sin(time * 0.6) * 0.1;
  // 카메라
  if (fly) {
    fly.t += dt; const u = Math.min(1, fly.t / fly.dur), e = easeIO(u);
    if (fly.ctrl) { const a = fly.p0.clone().lerp(fly.ctrl, e), b = fly.ctrl.clone().lerp(fly.p1, e); cam.p.copy(a.lerp(b, e)); }
    else cam.p.copy(fly.p0).lerp(fly.p1, e);
    cam.t.copy(fly.t0).lerp(fly.t1, easeIO(Math.min(1, u * 1.08)));
    if (u >= 1) fly = null;
  }
  const sm = 1 - Math.exp(-dt * 8);
  for (const k in view) viewS[k] += (view[k] - viewS[k]) * sm;
  // 과녁을 중심으로 천천히 돌아 입체감을 계속 보여 준다 + 사용자 회전·확대·이동
  const ang = viewS.yaw + Math.sin(time * 0.21) * 0.06 + (step === STEPS.length - 1 ? (time - stepT0) * 0.05 : 0);
  off.copy(cam.p).sub(cam.t).applyAxisAngle(UP, ang);
  right.copy(off).cross(UP).normalize();
  const el0 = Math.asin(THREE.MathUtils.clamp(off.y / off.length(), -1, 1));
  const pitch = THREE.MathUtils.clamp(el0 + viewS.pitch, -0.05, 1.45) - el0;
  off.applyAxisAngle(right, pitch).multiplyScalar(Math.exp(viewS.zoom));
  fwd.copy(cam.t).addScaledVector(right, -viewS.px).add(V3(0, viewS.py, 0));
  camera.position.copy(fwd).add(off).add(V3(0, Math.sin(time * 0.33) * 0.6, 0));
  camera.position.y = Math.max(camera.position.y, 1.5);
  camera.lookAt(fwd);
  fill.position.copy(camera.position); fill.target.position.copy(fwd);
  if (auto && !fly) { autoT += dt; if (voiceBusy()) autoT = 0; if (autoT > (voiceOn && primed && !narr.error ? 1.6 : step === 0 ? 7 : 9) + (HOLDS[step] || 0)) { autoT = 0; if (step < STEPS.length - 1) go(step + 1); else { auto = false; $("bAuto").setAttribute("aria-pressed", "false"); } } }
}

/* ═════════════ 영상 녹화 (?rec=1) — record.mjs 가 1/60 초씩 진행시키며 한 장씩 받아 간다 ═════════════ */
const REC = { on: QS.has("rec"), ready: false,
  intro() { startIntro(); },
  go(n) { go(n); },
  skip(n) { for (let i = 0; i < n; i++) { scene.updateMatrixWorld(); tick(1 / 60); } },   // 그리지 않고 시간만 진행 (일부 구간 다시 녹화용)
  shot(q = 0.93) { scene.updateMatrixWorld(); tick(1 / 60); renderer.render(scene, camera); return renderer.domElement.toDataURL("image/jpeg", q); },
};
window.REC = REC;

/* ═════════════ 시작 ═════════════ */
(async () => {
  const prog = (f, msg) => { $("lbar").style.width = (f * 100).toFixed(0) + "%"; $("lmsg").textContent = msg || ""; };
  try {
    await MathJax.startup.promise;
    if (!FONT_BODY || !FONT_TITLE) throw new Error("글꼴이 비어 있습니다 (build_fonts.py 를 실행하세요)");
    FB = opentype.parse(b64buf(FONT_BODY)); FT = opentype.parse(b64buf(FONT_TITLE));
    const t0 = performance.now(); await buildAll(prog); console.log("build ms", Math.round(performance.now() - t0));
  } catch (e) { $("lmsg").textContent = "오류: " + e.message; console.error(e.stack); return; }
  prog(1, "");
  const startStep = parseInt(QS.get("step") || "-1", 10);
  if (startStep >= 0) {
    introReady = true; introT = 99; go(startStep, true);
    for (const o of anims) o.v = o.when() ? 1 : -o.delay; for (const o of anims) o.apply(o.v);
    // 시험용: ?step=N&goto=1&sim=초 → 다음 단계로 넘어가 그만큼 시간을 흘린 모습
    if (QS.has("goto")) { go(step + 1); const n = Math.round(parseFloat(QS.get("sim") || "0") * 60); for (let i = 0; i < n; i++) { scene.updateMatrixWorld(); tick(1 / 60); } }
  } else { startIntro(); const n = Math.round(parseFloat(QS.get("sim") || "0") * 60); for (let i = 0; i < n; i++) { scene.updateMatrixWorld(); tick(1 / 60); } }
  $("load").style.opacity = 0; setTimeout(() => $("load").remove(), 1300);
  REC.ready = true;
  setTimeout(() => $("hint").style.opacity = 0, 9000);
  requestAnimationFrame(frame);
})();
</script>
</body>
